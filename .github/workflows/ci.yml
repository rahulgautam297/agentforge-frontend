name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Same "corepack prepare pnpm@latest" the Dockerfile itself uses
      # (see that file's own line) rather than a separate pnpm-install
      # action, so CI resolves pnpm the identical way the real image
      # build does -- no packageManager field pinned in package.json to
      # pin a specific pnpm version against instead.
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
